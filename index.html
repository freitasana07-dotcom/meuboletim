<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <!-- Cabeçalho do Boletim -->
    <header class="header">
      <h1>Boletim Digital</h1>
      <p class="subtitle">9º Ano — Turma 9B (Nº 1)</p>
    </header>
  
    
        
          

    <!-- Conteúdo do Boletim (Inicialmente Oculto) -->
    <div id="conteudo-boletim" class="oculto">
      <!-- Painel de Ações / Edição -->
      <section class="painel-acoes">
        <button id="btn-alternar-edicao" class="btn-acao">Alterar dados</button>
        <button id="btn-salvar" class="btn-acao btn-salvar oculto">Salvar alterações</button>
        <span id="mensagem-salvar" class="mensagem-status"></span>
      </section>

      <!-- Área de Cards de Resumo -->
      <section class="cards-grid">
        <div class="card card-media">
          <h3>Média Geral</h3>
          <p id="card-media-valor" class="card-valor">—</p>
        </div>

        <div class="card card-faltas">
          <h3>Total de Faltas</h3>
          <p id="card-faltas-valor" class="card-valor">—</p>
        </div>

        <div class="card card-bom">
          <h3>Bom Desempenho</h3>
          <p id="card-bom-valor" class="card-valor">—</p>
        </div>

        <div class="card card-atencao">
          <h3>Precisam de Atenção</h3>
          <p id="card-atencao-valor" class="card-valor">—</p>
        </div>

        <div class="card card-frequencia">
          <h3>Frequência Geral</h3>
          <p id="card-frequencia-valor" class="card-valor">92%</p>
          <span class="subtext">Frequência adequada</span>
        </div>
      </section>

      <!-- Área de Gráficos do Boletim -->
      <section class="area-graficos">
        <article class="grafico-card">
          <h2>Média por disciplina</h2>
          <div class="grafico-container grafico-container-barras">
            <canvas id="graficoMediasDisciplinas"></canvas>
          </div>
        </article>

        <article class="grafico-card">
          <h2>Evolução da média geral</h2>
          <div class="grafico-container">
            <canvas id="graficoEvolucaoTrimestres"></canvas>
          </div>
        </article>

        <article class="grafico-card" id="card-grafico-faltas">
          <div class="header-card-grafico">
            <h2>Faltas por trimestre</h2>
            <div id="estadoFaltas" class="badge-perigo oculto">Perigo</div>
          </div>
          <div class="grafico-container">
            <canvas id="graficoFaltasTrimestres"></canvas>
          </div>
        </article>
      </section>

      <!-- Tabela de Disciplinas -->
      <section class="table-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo">
            <!-- O JavaScript vai preencher as linhas da tabela automaticamente aqui -->
          </tbody>
        </table>
      </section>
    </div>
  </div>

  <!-- Biblioteca Chart.js para renderização
